          "acceptedAnswer": {
            "@type": "Answer",
            "text": "中国 D/E 摩托驾照不能直接在 VIC 上路。你需要去 VicRoads 做海外驾照转换：先 NAATI 翻译，再到 VicRoads 做眼测 + 知识测试。持照 ≥ 3 年的可以直接拿 Full Licence（无 LAMS 限制），< 3 年要先持 P 牌满 3 年才能解禁。"
          }
        },
        {
          "@type": "Question",
          "name": "什么是 LAMS？新手只能骑哪些摩托？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LAMS = Learner Approved Motorcycle Scheme，是 VIC 给新手骑士的限制：排量 ≤ 660cc 且功率/重量比 < 150kW/吨。新手 P 牌期间只能骑 LAMS 列表上的车。本指南列了 11 台精选 + 43 台完整目录，最热门的有 Ninja 400、MT-03、CB300R、Z650 LAMS、SV650 LAMS 等。"
          }
        },
        {
          "@type": "Question",
          "name": "168cm 身高选 MT-03 还是 Ninja 400？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MT-03 座椅 780mm 比 Ninja 400 的 785mm 略低，且街车姿势更直立——脚触地更友好。Ninja 400 是仿赛姿势前倾，对矮个不友好。168cm 推荐 MT-03、CB300R（800mm 但车窄）、CMX300 Rebel（690mm 巡航）、Meteor 350（765mm）。"
          }
        },
        {
          "@type": "Question",
          "name": "墨尔本第一次跑山去哪条路？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "新手第一次跑山推荐 Kinglake Loop（60km，距墨尔本 CBD 约 50km，难度低，路况好）。Black Spur（32km，墨尔本最经典 sweepers）适合骑车 4-6 个月后再去——它是维州官方记录的摩托事故黑点，没路肩、连续 hairpin、湿天危险。建议周日早 8 点前到，避开游客车流。"
          }
        },
        {
          "@type": "Question",
          "name": "澳洲摩托头盔可以从淘宝买吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "不建议。澳洲法律强制 AS/NZS 1698 认证，淘宝多数头盔只有 ECE 22.06 或中国 3C 认证，戴上路违法（罚款 A$300+ 扣 3 分）。第一顶头盔必须本地买。其他装备如手套、护具、骑行裤、雨衣可以淘宝海运——国产 SCOYCO 赛羽、PRO-BIKER、KOMINE 真品在国内便宜 30-50%。"
          }
        },
        {
          "@type": "Question",
          "name": "墨尔本摩托保险新手要多少钱一年？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VIC 强制 CTP（TAC）已含在车辆 reg fee 里。第三方财产险（TPP）A$200-500/年。综合险（Comprehensive）新手 P 牌 A$700-3800/年，持照 ≥ 3 年降到 A$320-700。新手溢价是真实的：同一辆 Ninja 300 学员可能 A$3800/年，老司机 A$368/年。比价 3-5 家（QBE / NRMA / RACV / Insure My Ride / Youi）能差 40%。"
          }
        },
        {
          "@type": "Question",
          "name": "墨尔本摩托被偷率高吗？怎么防盗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "墨尔本是澳洲摩托盗窃率第二高的城市。CBD / Footscray / Sunshine 是高发区。防盗四件套约 A$450-900：Disc Lock + 警报（A$150-200）、Chain Lock 18mm+（A$200-300）、Cover 车罩（A$50-100）、AirTag/Tracker（A$45-300）。AirTag 必须藏到外人摸不到的位置。"
          }
        }
      ]
